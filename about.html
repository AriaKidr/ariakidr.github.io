                        <h2>About Me</h2>

                        <p>
                            I am an MSci Theoretical Physics student at the
                            University of Birmingham, currently progressing
                            into the third year of my degree. I have achieved
                            a first-class average in both my first and second
                            years, and I am continuing to develop my
                            understanding of theoretical physics through
                            academic study, independent programming and
                            university research.
                        </p>

                        <p>
                            My interests currently lie at the intersection of
                            theoretical physics, computational modelling,
                            scientific data analysis and machine learning. I
                            particularly enjoy problems where mathematical
                            ideas can be translated into simulations,
                            algorithms or numerical experiments. This interest
                            has led me to explore applications ranging from
                            statistical mechanics and stellar astrophysics to
                            stochastic modelling and derivatives pricing.
                            Computational work allows me to examine systems
                            that may be difficult to solve analytically,
                            investigate their response to changing parameters
                            and communicate the resulting behaviour through
                            visualisations and reproducible code.
                        </p>

                        <h3>Computational Physics and the Ising Model</h3>

                        <p>
                            My first university research experience was as a
                            Summer Research Assistant in the Theoretical
                            Physics Group at the University of Birmingham.
                            During this placement, I worked under the
                            supervision of Professor Mark Dennis and
                            Dr Jonathan Watkins on the computational modelling
                            of phase transitions.
                        </p>

                        <p>
                            The central focus of this work was the
                            two-dimensional Ising model, a model from
                            statistical mechanics that represents a material
                            as a lattice of interacting spins. Each spin can
                            occupy one of two states, and the collective
                            behaviour of these spins provides a comparatively
                            simple but powerful way to investigate magnetism,
                            thermal fluctuations, ordered states and phase
                            transitions.
                        </p>

                        <p>
                            I developed a Python program that calculates the
                            Hamiltonian energy and magnetisation of the
                            lattice. I then implemented the Metropolis
                            algorithm to introduce probabilistic spin changes
                            and simulate the evolution of the system at
                            different temperatures. This allowed me to explore
                            the relationship between microscopic spin
                            interactions and macroscopic quantities such as
                            energy and magnetisation.
                        </p>

                        <p>
                            I produced graphs showing how the energy and
                            magnetisation evolved over successive simulation
                            steps and how their behaviour changed across
                            different temperatures. I also animated the
                            lattice so that its evolution could be viewed
                            directly, making it possible to observe ordered
                            regions forming and changing as the simulation
                            approached lower-energy configurations.
                        </p>

                        <p>
                            This project strengthened my understanding of
                            statistical mechanics while teaching me how to
                            convert mathematical definitions into working
                            computational procedures. It gave me practical
                            experience in numerical modelling, stochastic
                            algorithms, data visualisation, debugging and
                            interpreting simulation results. I documented the
                            program with step-by-step comments and published
                            the work on GitHub so that other readers could
                            follow the structure and development of the model.
                        </p>

                        <p>
                            My Ising model project is available on my GitHub
                            page.
                        </p>

                        <h3>Machine Learning and Stellar Data</h3>

                        <p>
                            I broadened my research experience through a
                            Summer Research Internship with the Sun, Stars and
                            Exoplanets Group at the University of Birmingham.
                            This work introduced me to a different area of
                            physics by combining astrophysics, scientific data
                            analysis and machine learning.
                        </p>

                        <p>
                            During this project, I developed and optimised an
                            autoencoder designed to denoise and reconstruct
                            stellar power spectra represented through
                            frequency and power data. An autoencoder is a
                            neural-network architecture that learns a
                            compressed representation of its input before
                            reconstructing it. By training the model to
                            preserve meaningful structure while reducing
                            unwanted noise, it can support the analysis of
                            complex observational datasets.
                        </p>

                        <p>
                            I began by producing physically informed
                            artificial data that could be used as a controlled
                            learning environment. Working with synthetic
                            examples allowed me to observe the behaviour of the
                            network, understand how changes to its architecture
                            and training process affected its output, and
                            identify problems before applying the model to real
                            observations.
                        </p>

                        <p>
                            I then progressed to data from the Kepler mission,
                            processing observations involving approximately
                            5,000 red giant stars into reproducible training
                            and validation datasets. This stage of the project
                            gave me experience of moving from an idealised
                            computational problem to a large real-world
                            scientific dataset, where noise, variation and
                            uncertainty form an important part of the research
                            challenge.
                        </p>

                        <p>
                            I analysed the model's latent representations and
                            investigated the nonlinear recovery of the
                            frequency of maximum oscillation power using
                            reconstruction losses, residual diagnostics and
                            signal-processing baselines. This required me to
                            consider not only whether the network could
                            reconstruct its inputs, but also whether the
                            compressed representation retained physically
                            meaningful information.
                        </p>

                        <p>
                            The internship developed my understanding of neural
                            networks and their use in scientific research while
                            strengthening my ability to prepare, inspect and
                            interpret numerical data. It showed me how methods
                            from computer science can be adapted to investigate
                            problems in astrophysics and encouraged me to
                            explore research areas connecting theoretical ideas
                            with modern computational tools.
                        </p>

                        <p>
                            I maintained documented code on GitHub throughout
                            the project and discussed the research at the 2026
                            National Astronomy Meeting. This gave me further
                            experience in presenting developing scientific work
                            and explaining the motivation, methodology and
                            limitations of a computational research project.
                        </p>

                        <h3>
                            Quantitative Finance and Derivatives Pricing
                        </h3>

                        <p>
                            I am currently developing an independent
                            quantitative-finance research project titled
                            <strong>
                                GPU-Accelerated Machine Learning for
                                Derivatives Pricing
                            </strong>.
                            The project extends my interests in stochastic
                            modelling, numerical methods and machine learning
                            into mathematical finance, with a particular focus
                            on the computational challenges involved in pricing
                            and calibrating derivative models.
                        </p>

                        <p>
                            The central research question is whether a
                            differentiable neural network can approximate the
                            Heston stochastic-volatility pricing map
                            accurately enough to reduce the computational cost
                            of repeated model calibration. In this setting,
                            the forward problem maps option-contract
                            information, market inputs and Heston parameters
                            to an option value, while calibration approaches
                            the problem in reverse by searching for the model
                            parameters that best reproduce a given surface of
                            option prices or implied volatilities.
                        </p>

                        <p>
                            I am building the project progressively from its
                            mathematical and financial foundations rather than
                            treating the neural network as an isolated
                            prediction tool. My current work includes
                            developing an understanding of financial
                            instruments, market quotations, option contracts,
                            discounting, returns, no-arbitrage relationships,
                            probability, Brownian motion and stochastic
                            differential equations.
                        </p>

                        <p>
                            I am translating each concept into small Python
                            implementations, hand-checked examples and
                            numerical tests before incorporating it into the
                            larger research pipeline. This process includes
                            defining variables and units explicitly, testing
                            boundary cases and comparing computational results
                            with independently derived relationships.
                        </p>

                        <p>
                            An important part of the early project is the
                            simulation of Brownian motion and correlated
                            Gaussian shocks. These stochastic components
                            provide the foundation for geometric Brownian
                            motion and the Heston model. I am using Monte Carlo
                            experiments to investigate how empirical means,
                            variances and correlations approach their
                            theoretical values as the number of simulated
                            paths increases.
                        </p>

                        <p>
                            The first major pricing stage uses the
                            Black-Scholes model as an analytical benchmark. I
                            am implementing European call and put valuation,
                            implied-volatility inversion and option
                            sensitivities while testing the results against
                            financial bounds, limiting behaviour, put-call
                            parity and finite-difference calculations.
                        </p>

                        <p>
                            I am also developing Monte Carlo simulations of
                            geometric Brownian motion and comparing simulated
                            option values with corresponding analytical
                            results. Rather than treating one simulated value
                            as definitive, I am measuring sampling uncertainty,
                            repeating experiments across random seeds and
                            examining convergence as the number of simulated
                            paths increases.
                        </p>

                        <p>
                            The project will then progress to the Heston model,
                            which represents variance as a stochastic,
                            mean-reverting process rather than assuming that
                            volatility remains constant. The model introduces
                            correlated spot and variance shocks and can
                            represent features of implied-volatility surfaces
                            that cannot be reproduced by a single constant
                            volatility.
                        </p>

                        <p>
                            I plan to implement and validate the Heston
                            dynamics, investigate timestep convergence,
                            variance positivity and numerical stability, and
                            compare results across different discretisation
                            choices. The resulting pricing engine will then be
                            used to generate synthetic option-price and
                            implied-volatility surfaces over a clearly
                            documented range of model parameters.
                        </p>

                        <p>
                            Using these validated synthetic data, I intend to
                            train a neural surrogate in PyTorch to approximate
                            the Heston forward-pricing map. The network will
                            receive option, market and model inputs and produce
                            a model-consistent option value or related pricing
                            quantity.
                        </p>

                        <p>
                            Because the surrogate is differentiable, automatic
                            differentiation can provide gradients for
                            optimisation, creating the possibility of faster
                            gradient-based calibration. The project will
                            compare calibration through the neural surrogate
                            with a classical pricing approach using the same
                            observations, parameter bounds, objective
                            functions and initial conditions wherever a direct
                            comparison is appropriate.
                        </p>

                        <p>
                            The final evaluation will consider more than
                            neural-network test loss. I plan to measure pricing
                            and implied-volatility errors, surface
                            reconstruction, parameter recovery, gradient
                            accuracy, convergence and failure rates, and
                            computational performance across interpolation,
                            boundary and stressed parameter regimes.
                        </p>

                        <p>
                            Runtime experiments will distinguish one-time
                            data-generation and training costs from repeated
                            calibration costs. They will also account for
                            hardware, tensor precision, batch size, accelerator
                            warm-up, synchronisation and repeated measurements,
                            allowing any computational advantage to be
                            evaluated on a fair and reproducible basis.
                        </p>

                        <p>
                            This project is strengthening my knowledge of
                            probability, stochastic processes, derivatives
                            pricing, numerical optimisation and scientific
                            machine learning. It is also developing my approach
                            to computational research: defining units and
                            assumptions explicitly, validating each numerical
                            layer independently, recording unsuccessful
                            experiments and ensuring that conclusions remain
                            within the domain actually tested.
                        </p>

                        <p>
                            The project concerns mathematical valuation,
                            computational acceleration and model calibration.
                            It is not intended as a stock-price forecasting
                            system, a real-money trading project or a claim
                            about trading profitability.
                        </p>

                        <h3>Teaching and Scientific Communication</h3>

                        <p>
                            Alongside my degree and research experience, I work
                            remotely as a Mathematics and Physics tutor. I
                            teach students at GCSE and A-level, helping them
                            develop their subject knowledge, mathematical
                            reasoning and independent problem-solving skills.
                        </p>

                        <p>
                            Tutoring has strengthened my ability to communicate
                            technical concepts clearly and adapt an explanation
                            to the needs of an individual student. It has
                            encouraged me to think carefully about the
                            foundations of the subjects I study. Explaining an
                            idea effectively requires more than knowing how to
                            apply a formula: it requires understanding why the
                            method works, how the different steps connect and
                            where misunderstandings are likely to arise.
                        </p>

                        <p>
                            Balancing tutoring with a full-time physics degree,
                            summer research and independent projects has also
                            developed my time management, organisation and
                            personal responsibility. These are qualities that I
                            hope to carry into future research environments,
                            where independent work must be combined with clear
                            communication and productive collaboration.
                        </p>

                        <h3>Technical Skills</h3>

                        <p>
                            Python is currently my principal programming
                            language and the main tool I use for computational
                            physics, numerical simulation, scientific data
                            analysis, quantitative modelling and
                            machine-learning projects. My work uses libraries
                            including NumPy, Pandas, SciPy, Matplotlib,
                            TensorFlow/Keras and PyTorch, with Jupyter
                            notebooks supporting exploratory analysis and
                            documented numerical experiments.
                        </p>

                        <p>
                            I also use Git and GitHub for version control,
                            LaTeX to prepare technical and mathematical
                            documents, Bash for command-line and
                            high-performance computing workflows, and HTML and
                            CSS to develop this portfolio.
                        </p>

                        <p>
                            I am interested not only in obtaining a result, but
                            also in ensuring that my work is understandable and
                            reproducible. I therefore aim to organise programs
                            carefully, document their purpose, define variables
                            and units clearly, and explain the reasoning behind
                            important stages of an analysis.
                        </p>

                        <p>
                            I use tests, known identities, analytical
                            benchmarks, limiting cases and repeated simulations
                            to check numerical work wherever possible. As my
                            experience develops, I hope to improve the
                            structure, efficiency, testing and presentation of
                            my scientific software.
                        </p>

                        <h3>Collaboration and Wider Experience</h3>

                        <p>
                            I received a Birmingham Project award after working
                            in a multidisciplinary team on a challenge
                            connected with Siemens. Our project considered how
                            Siemens technologies could be integrated to support
                            sustainable education across a university campus.
                        </p>

                        <p>
                            This experience allowed me to work with people from
                            different academic backgrounds and contribute to a
                            problem whose technological, educational and
                            environmental elements extended beyond a single
                            discipline.
                        </p>

                        <p>
                            I have also completed five team-based Python, Bash
                            and high-performance computing challenges through
                            the University of Birmingham's BLUEBear Challenge.
                            These included tasks involving galaxy
                            classification, ray tracing and supercomputer
                            network-topology design.
                        </p>

                        <p>
                            The challenges gave me experience of working with
                            unfamiliar technical problems under time
                            constraints, collaborating with other students and
                            using computational tools beyond a standard
                            individual programming environment.
                        </p>

                        <p>
                            Before university, I worked as a furniture
                            assembler at DH Furniture Group Ltd. In this role,
                            I operated and maintained a CNC machine, followed
                            technical specifications, responded to minor
                            operational problems and worked with others to meet
                            production targets.
                        </p>

                        <p>
                            Although this role was outside physics, it helped
                            me develop practical problem-solving skills,
                            attention to detail and an appreciation of how
                            technical processes operate in a professional
                            working environment.
                        </p>

                        <h3>Future Research and PhD Ambitions</h3>

                        <p>
                            In the longer term, I am interested in pursuing a
                            PhD. I have not yet decided on one specific field,
                            and I view the remaining years of my MSci degree as
                            an opportunity to explore different areas in
                            greater depth before making that decision.
                        </p>

                        <p>
                            My research experiences have so far exposed me to
                            several distinct but connected directions. My work
                            on the Ising model introduced me to statistical
                            mechanics, phase transitions, stochastic
                            simulation and computational theoretical physics.
                            My work with stellar data introduced me to
                            astrophysics, machine learning and the analysis of
                            large observational datasets.
                        </p>

                        <p>
                            My independent work in quantitative finance has
                            introduced me to derivatives pricing,
                            stochastic-volatility models and calibration as an
                            inverse problem. Although this project sits outside
                            a traditional physics setting, it draws on many of
                            the same mathematical and computational ideas,
                            including stochastic differential equations,
                            Monte Carlo methods, numerical optimisation and
                            machine learning.
                        </p>

                        <p>
                            Because of this, I am currently open-minded about
                            the precise subject of a future doctorate. Possible
                            areas of interest include computational physics,
                            statistical mechanics, theoretical astrophysics,
                            stellar physics, scientific machine learning and
                            the application of stochastic modelling to complex
                            physical or financial systems.
                        </p>

                        <p>
                            I am also interested in discovering other fields in
                            which mathematical modelling, numerical simulation
                            and scientific computing play central roles. I
                            have particularly enjoyed the process of building
                            computational methods that reveal patterns,
                            physical behaviour or parameter relationships
                            within complex systems.
                        </p>

                        <p>
                            I hope that a PhD would allow me to investigate a
                            focused research question over an extended period,
                            develop greater independence as a researcher and
                            make an original contribution to a mathematical,
                            physical or computational field. I am particularly
                            attracted to the combination of deep theoretical
                            understanding and practical computational
                            investigation, as well as the collaborative nature
                            of modern research.
                        </p>

                        <p>
                            Over the remainder of my degree, I want to deepen
                            my mathematical and physical knowledge, gain
                            further research experience, improve my
                            programming and data-analysis skills, and learn
                            more about the research groups and doctoral
                            projects available across different disciplines.
                        </p>

                        <p>
                            Rather than choosing a PhD field prematurely, I
                            want to make an informed decision based on the
                            subjects, questions and research methods that I
                            find most intellectually rewarding.
                        </p>

                        <h3>Beyond Physics</h3>

                        <p>
                            Outside my academic work, I enjoy swimming, playing
                            badminton and writing movie reviews. These
                            interests give me opportunities to remain active,
                            reflect creatively and maintain a balance between
                            university, research, tutoring and my personal
                            life. I also speak English and Kurdish Sorani.
                        </p>

                        <h3>Current Goals</h3>

                        <p>
                            My immediate goal is to continue building a broad
                            and rigorous foundation in theoretical physics
                            while developing the computational and mathematical
                            skills needed for modern research.
                        </p>

                        <p>
                            I am currently continuing the development of my
                            independent derivatives-pricing project,
                            strengthening my understanding of stochastic
                            processes, implementing and validating foundational
                            pricing methods, and preparing the numerical
                            groundwork for the later Heston and neural-surrogate
                            stages of the project.
                        </p>

                        <p>
                            More broadly, I am keen to undertake further
                            projects, collaborate with researchers, improve the
                            quality of my public programming portfolio and
                            explore the areas of physics, applied mathematics,
                            scientific computing and quantitative modelling
                            that may eventually form the basis of my doctoral
                            research.
                        </p>
