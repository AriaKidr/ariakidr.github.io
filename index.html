<!DOCTYPE HTML>

<html lang="en">
<head>
    <title>Aria Kidr | Theoretical Physics</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>

    <style>
        /*
            ============================================================
            SPEED CONTROLS
            Change only these values to adjust how quickly things appear.
            Smaller values are faster. Use 0s for instant appearance.
            ============================================================
        */
        :root {
            --page-fade-time: 0.16s;
            --overlay-fade-time: 0.16s;
            --text-appear-time: 0.2s;
            --text-delay: 0s;
            --logo-appear-time: 0.10s;
            --logo-delay: 0.02s;
            --logo-gap: 0.02s;
        }

        /* Override the slow animations built into the Aerial template. */
        #wrapper {
            animation: fast-fade var(--page-fade-time) ease-out forwards !important;
            opacity: 0;
        }

        #overlay {
            animation: fast-fade var(--overlay-fade-time) ease-out forwards !important;
            opacity: 0;
        }

        #header {
            animation: fast-rise var(--text-appear-time) ease-out var(--text-delay) forwards !important;
            opacity: 0;
        }

        #header nav li {
            animation: fast-rise var(--logo-appear-time) ease-out forwards !important;
            opacity: 0;
        }

        /* Small stagger between icons. Set --logo-gap to 0s for all at once. */
        #header nav li:nth-child(1) {
            animation-delay: calc(var(--logo-delay) + var(--logo-gap) * 0) !important;
        }

        #header nav li:nth-child(2) {
            animation-delay: calc(var(--logo-delay) + var(--logo-gap) * 1) !important;
        }

        #header nav li:nth-child(3) {
            animation-delay: calc(var(--logo-delay) + var(--logo-gap) * 2) !important;
        }

        #header nav li:nth-child(4) {
            animation-delay: calc(var(--logo-delay) + var(--logo-gap) * 3) !important;
        }

        #header nav li:nth-child(5) {
            animation-delay: calc(var(--logo-delay) + var(--logo-gap) * 4) !important;
        }

        @keyframes fast-fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fast-rise {
            from {
                opacity: 0;
                transform: translate3d(0, 0.12em, 0);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        #header nav ul li {
            position: relative;
        }

        #header nav ul li a {
            position: relative;
            z-index: 10;
            cursor: pointer;
            pointer-events: auto;
        }

        /* Ensure decorative layers never block the links. */
        #bg,
        #overlay {
            pointer-events: none;
        }

        /* Labels displayed when an icon is hovered or keyboard-focused. */
        #header nav ul li a::after {
            content: attr(data-label);
            position: absolute;
            left: 50%;
            top: calc(100% + 0.8em);
            transform: translate(-50%, -0.25em);
            padding: 0.35em 0.7em;
            border-radius: 0.35em;
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 0.35em;
            font-weight: normal;
            letter-spacing: 0.08em;
            line-height: 1.4;
            text-transform: none;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.1s ease, transform 0.1s ease, visibility 0.1s ease;
        }

        #header nav ul li a:hover::after,
        #header nav ul li a:focus::after {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        /* Visitors who prefer reduced motion see everything immediately. */
        @media (prefers-reduced-motion: reduce) {
            #wrapper,
            #overlay,
            #header,
            #header nav li,
            #bg {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>

<body class="is-preload">

            <footer id="footer">

    <script>
        /*
            This runs as soon as the HTML is ready. Unlike window.onload,
            it does not wait for every background image and asset.
        */
        document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.remove("is-preload");
